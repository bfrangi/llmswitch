[project]
name = "llmswitch"
version = "0.3.0"
description = "Switch Claude Code between Anthropic, Ollama, and any other LLM server through one local endpoint, by model name"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bernat Frangi" }]
keywords = ["claude-code", "ollama", "llm", "gateway", "proxy", "anthropic", "router"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
]

[project.urls]
Homepage = "https://github.com/bfrangi/llmswitch"
Repository = "https://github.com/bfrangi/llmswitch"
Issues = "https://github.com/bfrangi/llmswitch/issues"

[project.scripts]
llmswitch = "llmswitch.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llmswitch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TC", "RUF", "C4", "PIE", "PERF", "RET", "PTH"]
ignore = ["E501", "RET505", "RET506", "PERF203"]

[tool.ruff.lint.flake8-type-checking]
strict = true
exempt-modules = ["typing", "fastapi", "starlette"]

[tool.ruff.lint.isort]
known-first-party = ["llmswitch"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "RUF012", "TC"]
